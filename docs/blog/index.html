<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      href="/assets/styles.css"
      rel="stylesheet"
    />
    <title>Blog | Tuyen Huynh personal website</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Yomogi&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="page">
      
      
      <nav
        id="tab-bar"
        aria-label="Site sections">
        
          <a
            href="/"
            class="tab"
            >about me</a>
        
          <a
            href="/blog/"
            class="tab"
            aria-current="page">blog</a>
        
      </nav>
      <main id="innerBody">
        <section>
  <h1>
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4" /><path d="M2 6h4" /><path d="M2 10h4" /><path d="M2 14h4" /><path d="M2 18h4" /><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" /></svg> Blog
  </h1>
  <p>No posts yet. Check back soon!</p>
</section>

      </main>
    </div>
    
    <button
      type="button"
      id="scroll-top-btn"
      aria-label="Scroll to top"
      title="Scroll to top">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7" /><path d="M12 19V5" /></svg>
    </button>
    <script>
    const scrollTopBtn = document.getElementById("scroll-top-btn");
      const toggleScrollTopBtn = () => {
        scrollTopBtn
          .classList
          .toggle("is-shown", window.scrollY > 400);
      };
      window.addEventListener("scroll", toggleScrollTopBtn, {passive: true});
      toggleScrollTopBtn();
      scrollTopBtn.addEventListener("click", () => {
        const reduceMotion = window
          .matchMedia("(prefers-reduced-motion: reduce)")
          .matches;
        window.scrollTo({
          top: 0,
          behavior: reduceMotion
            ? "auto"
            : "smooth"
        });
      });
    </script>
  </body>
</html>

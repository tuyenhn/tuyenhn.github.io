<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" aria-labelledby="hpo-1d-title hpo-1d-desc">
  <title id="hpo-1d-title">Tuning one hyperparameter: search the HP value against the measure</title>
  <desc id="hpo-1d-desc">The x-axis is the value of one hyperparameter. The y-axis is the measure, for example RMSE, where lower is better. A dashed gray curve shows the true relationship, which is unknown in practice. Eight blue dots are the HP values that were tried, evenly spaced along the x-axis, each at its cross-validated score. The dot with the lowest score is circled, and a dashed line drops from it to the x-axis to mark the best HP value. The best tried value is near, but not exactly at, the minimum of the true curve.</desc>

  <!-- Hand-written SVG, edit as text. Colours are Tailwind values, as on the site (same as hpo-cv-loop.svg):
       gray = axes and the true curve, blue-500 = tried values, blue-700 = the best value.
       The curve is y = 0.30 + 2 (x - 0.42)^2 + 0.03 sin(11 x + 0.5) for x in [0, 1];
       plot box x 80..610, y 40..290, y range 0.2..1.1 (y = 290 is 0.2). No numbers on the axes: the figure is a concept.
       Do not add a <style> element: if the SVG is put into the page, its rules would apply to the whole post. -->
  <defs>
    <marker id="hpo-1d-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <g font-family="Montserrat, ui-sans-serif, system-ui, sans-serif" dominant-baseline="central">

    <!-- axes -->
    <path d="M66 300 H636" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#hpo-1d-arrow)"/>
    <path d="M66 300 V16" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#hpo-1d-arrow)"/>
    <text x="351" y="338" text-anchor="middle" font-size="13" fill="#1f2937">Hyperparameter value</text>
    <g transform="rotate(-90)" text-anchor="middle">
      <text x="-165" y="28" font-size="13" fill="#1f2937">Measure (e.g. RMSE)</text>
      <text x="-165" y="46" font-size="11" fill="#6b7280">lower is better</text>
    </g>

    <!-- the true relationship between the HP and the measure (unknown in practice) -->
    <path d="M80.0 160.2 L85.3 164.1 L90.6 167.8 L95.9 171.6 L101.2 175.3 L106.5 178.9 L111.8 182.6 L117.1 186.2 L122.4 189.8 L127.7 193.4 L133.0 197.0 L138.3 200.6 L143.6 204.1 L148.9 207.7 L154.2 211.2 L159.5 214.7 L164.8 218.2 L170.1 221.7 L175.4 225.1 L180.7 228.5 L186.0 231.8 L191.3 235.0 L196.6 238.2 L201.9 241.2 L207.2 244.2 L212.5 247.1 L217.8 249.8 L223.1 252.4 L228.4 254.9 L233.7 257.2 L239.0 259.3 L244.3 261.3 L249.6 263.1 L254.9 264.7 L260.2 266.1 L265.5 267.3 L270.8 268.3 L276.1 269.1 L281.4 269.7 L286.7 270.0 L292.0 270.2 L297.3 270.1 L302.6 269.9 L307.9 269.4 L313.2 268.7 L318.5 267.9 L323.8 266.8 L329.1 265.6 L334.4 264.2 L339.7 262.7 L345.0 261.0 L350.3 259.2 L355.6 257.2 L360.9 255.1 L366.2 252.9 L371.5 250.6 L376.8 248.3 L382.1 245.8 L387.4 243.3 L392.7 240.8 L398.0 238.1 L403.3 235.5 L408.6 232.8 L413.9 230.1 L419.2 227.4 L424.5 224.7 L429.8 221.9 L435.1 219.2 L440.4 216.4 L445.7 213.6 L451.0 210.8 L456.3 208.0 L461.6 205.2 L466.9 202.3 L472.2 199.4 L477.5 196.5 L482.8 193.5 L488.1 190.5 L493.4 187.4 L498.7 184.2 L504.0 181.0 L509.3 177.6 L514.6 174.1 L519.9 170.5 L525.2 166.8 L530.5 162.9 L535.8 158.9 L541.1 154.7 L546.4 150.4 L551.7 145.8 L557.0 141.1 L562.3 136.2 L567.6 131.1 L572.9 125.8 L578.2 120.2 L583.5 114.5 L588.8 108.5 L594.1 102.4 L599.4 96.0 L604.7 89.4 L610.0 82.6" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>

    <!-- the best tried value: a ring around its dot, and a dashed line down to the x-axis -->
    <path d="M310.6 281 V300" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="310.6" cy="269.1" r="11" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="310.6" y="315" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">best HP value</text>
    <text x="326" y="287" font-size="11" fill="#4b5563">lowest score</text>

    <!-- the tried values (a grid of 8), each at its score; white ring so the dots stand off the curve -->
    <g fill="#3b82f6" stroke="#ffffff" stroke-width="2">
      <circle cx="111.8" cy="182.6" r="5"/>
      <circle cx="178.1" cy="226.8" r="5"/>
      <circle cx="244.3" cy="261.3" r="5"/>
      <circle cx="376.8" cy="248.3" r="5"/>
      <circle cx="443.1" cy="215.0" r="5"/>
      <circle cx="509.3" cy="177.6" r="5"/>
      <circle cx="575.5" cy="123.0" r="5"/>
      <circle cx="310.6" cy="269.1" r="6" fill="#1d4ed8"/>
    </g>

    <!-- legend -->
    <circle cx="102" cy="26" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
    <text x="116" y="26" font-size="12" fill="#4b5563">Tried HP value, at its CV score</text>
    <path d="M92 48 H112" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
    <text x="116" y="48" font-size="12" fill="#4b5563">True relationship (unknown in practice)</text>
  </g>
</svg>
